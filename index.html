<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <h3 id="welcomeUser"></h3>
    <div id="postSection">
      <textarea id="postText" placeholder="What's on your mind?" class="form-control mb-2"></textarea>
      <input type="text" id="postImage" placeholder="Image URL (optional)" class="form-control mb-2">
      <button class="btn btn-primary" id="postBtn">Post</button>
    </div>
    <hr>
    <div id="postsContainer"></div>
  </div>

  <!-- Removed feed.js script reference because file is missing -->
</body>
</html>
