<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <!-- Bootsrap CSS link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- Custom CSS link -->
<link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <section class="vh-150 gradient-custom">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card bg-dark text-white" style="border-radius: 1rem">
              <div class="card-body p-5 text-center">
                <div class="mb-md-5 mt-md-4 pb-5">
                  <form onsubmit="datasubmit()" return false>
                    <h1 class="fw-bold mb-2 text-uppercase">Sign in Form</h1>
                    <div
                      data-mdb-input-init
                      class="form-outline form-white mb-4"
                    >
                      <label class="Nameuser" for="Username">Username:</label>
                      <input
                        type="text"
                        id="Username"
                        class="form-control form-control-lg"
                        placeholder="Enter Name"
                        name="Username"
                        autofocus
                        required
                      />
                    </div>
                    <div
                      data-mdb-input-init
                      class="form-outline form-white mb-4"
                    >
                      <label class="Nameemail" for="Email">Email:</label>
                      <input
                        type="text"
                        id="Email"
                        class="form-control form-control-lg"
                        placeholder="Enter Email"
                        name="Email"
                        required
                      />
                    </div>
                    <div
                      data-mdb-input-init
                      class="form-outline form-white mb-4"
                    >
                      <label class="Namepass" for="password">Password:</label>
                      <input
                        type="text"
                        id="password"
                        class="form-control form-control-lg"
                        placeholder="Enter Password"
                        name="password"
                        required
                      />
                    </div>
                    <button
                      data-mdb-button-init
                      data-mdb-ripple-init
                      class="btn btn-outline-light btn-lg px-5"
                      id="submit"
                    >
                      Submit
                    </button>
                    <h6 class="next-page">
Already have an account
                      <a href="../login/login.html">Login</a>
                    </h6>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
       <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootsrap JS link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <!-- Custom JS link -->
    <!-- Removed app.js script reference as file not present -->
   
  </body>
</html>
